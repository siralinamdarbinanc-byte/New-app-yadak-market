name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Web Application
        run: bun run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Decode Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/yadak.keystore

      - name: Capacitor Sync
        run: |
          bunx cap add android || true
          bunx cap sync android

      - name: Configure Signing
        run: |
          sed -i "/android {/a\
    signingConfigs {\n        release {\n            storeFile file("${GITHUB_WORKSPACE}/yadak.keystore")\n            storePassword "${{ secrets.STORE_PASSWORD }}"\n            keyAlias "${{ secrets.KEY_ALIAS }}"\n            keyPassword "${{ secrets.KEY_PASSWORD }}"\n        }\n    }" android/app/build.gradle
          sed -i "/buildTypes {/a\
        release { signingConfig signingConfigs.release }" android/app/build.gradle

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/yadak.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YadakMarket-Release-APK
          path: android/**/build/outputs/apk/**/*.apk
